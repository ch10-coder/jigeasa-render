<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.min.js", "three/addons/": "./assets/vendor/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #earth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #s01-fx { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,9,27,.82) 0%, rgba(4,9,27,.82) 26%, rgba(4,9,27,0) 55%); }
      .block { position: absolute; left: 96px; top: 150px; width: 1100px; }
      .kicker { display: flex; align-items: center; gap: 16px; font: 700 28px Inter; letter-spacing: 5px; color: #fbbf24; text-transform: uppercase;
                text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .kicker i { display: block; width: 44px; height: 6px; background: #fbbf24; transform-origin: left center; }
      .mask { overflow: hidden; }
      .gap { height: 22px; }
      .h { font: 400 180px/1.04 Anton; color: #f8fafc; text-transform: uppercase; white-space: nowrap;
           text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .h.k { color: #ff6b6b; }
      .odo { display: inline-block; height: 1.04em; overflow: hidden; vertical-align: top; }
      .odo-col { display: block; }
      .odo-col span { display: block; height: 1.04em; }
      .sub { margin-top: 20px; font: 500 40px Inter; color: rgba(226,232,240,.94); white-space: nowrap;
             text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .credit { position: absolute; left: 0; right: 0; top: 1028px; text-align: center; font: 600 20px Inter; color: #cbd5e1; letter-spacing: 1px;
                text-shadow: 0 2px 2px rgba(2,6,16,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="55.0" data-width="1920" data-height="1080">
      <canvas id="earth"></canvas>
      <svg id="s01-fx" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g id="s01-arcs"></g>
        <g id="s01-pulses"></g>
      </svg>
      <div class="scrim" id="s01-scrim"></div>
      <div class="block" id="s01-block">
        <div class="kicker"><i id="s01-rule"></i><span id="s01-kick">October 2026</span></div>
        <div class="gap"></div>
        <div class="mask"><div class="h" id="s01-h1"><span class="odo"><span class="odo-col" id="s01-odo"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></span></span> AAG</div></div>
        <div class="mask"><div class="h k" id="s01-h2">Ek Bharat.</div></div>
        <div class="mask"><div class="sub" id="s01-sub">Har aag ka dhuaan Bharat tak pahunchta hai</div></div>
      </div>
      <div class="credit">NASA Blue Marble &nbsp;·&nbsp; Borders: DataMeet, Natural Earth (India view)</div>
    </div>
    <script type="module">
      import { createEarth, camAt, driveWithTimeline } from "./assets/geo/engine.js";
      /*CUES*/ const CUES = {"c01": 0.6, "c02": 8.95, "c03": 11.89, "c04": 14.35, "c05": 17.78, "c06": 19.25, "c07": 25.15, "c08": 29.56, "c09": 33.49, "c10": 39.87, "c11": 41.84, "c12": 43.31, "c13": 46.25, "c14": 51.16}; /*END CUES*/
      const DUR = /*DUR*/ 55.0 /*END DUR*/;
      const C = CUES;

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      let done;
      window.__hf.buildReady["earth"] = new Promise((r) => (done = r));

      // ---------- camera: START (24,50,26000) -> slow spin east while the fires light -> push in for the title -> END (30,62,24000)
      const CAM = [
        { t: 0, lat: 24, lon: 50, alt: 26000, tilt: 0, heading: 0 },
        { t: C.c02 + 0.6, lat: 25, lon: 56, alt: 24500, tilt: 0, heading: 0 },               // lean to Hormuz
        { t: C.c04 + 0.9, lat: 29, lon: 70, alt: 23500, tilt: 0, heading: 0 },               // Punjab, Ladakh, Karakoram
        { t: C.c05 + 0.9, lat: 32, lon: 64, alt: 25000, tilt: 0, heading: 0 },               // lean west for Europe
        { t: C.c07, lat: 27, lon: 79, alt: 24500, tilt: 0, heading: 0 },                     // swing east for Taiwan
        { t: C.c08 + 1.5, lat: 27, lon: 74, alt: 27000, tilt: 0, heading: 0 },               // "hazaaron km door": whole picture
        { t: C.c09 + 4.5, lat: 32, lon: 67, alt: 15500, tilt: 0, heading: 0 },               // push in for the title
        { t: C.c14, lat: 32.6, lon: 69.5, alt: 14300, tilt: 0, heading: 0, ease: "linear" }, // slow drift under the hold
        { t: DUR, lat: 30, lon: 62, alt: 24000, tilt: 0, heading: 0 },                        // hand-off
      ];

      // ---------- helpers (pure functions of t)
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (t, a, d) => clamp01((t - a) / d);
      const smooth = (x) => x * x * (3 - 2 * x);
      const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

      function makePulse(layer, maxR = 42) {
        const g = el("g", { opacity: 0 }, layer);
        const rings = [150, 90, 50].map((a) => ({ a: a / 255, c: el("circle", { r: 11, fill: "none", stroke: "#ff6b6b", "stroke-width": 2.5 }, g) }));
        const dot = el("circle", { r: 11, fill: "#ff6b6b" }, g);
        el("circle", { r: 4.5, fill: "#f8fafc" }, g);
        return { g, rings, dot, maxR };
      }
      function drawPulse(P, p, t, tOn, alpha, boost = 0) {
        const a = alpha * (t >= tOn ? 1 : 0) * (p.visible ? 1 : 0);
        if (a <= 0.002) { P.g.setAttribute("opacity", 0); return; }
        const k = clamp01((t - tOn) / 0.5);
        const s = (k >= 1 ? 1 : Math.max(0, backOut(k))) * (1 + 0.3 * boost);
        P.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${s.toFixed(3)})`);
        P.g.setAttribute("opacity", a.toFixed(3));
        P.dot.setAttribute("r", (11 * (1 + 0.07 * Math.sin((t - tOn) * Math.PI * 2 / 1.6))).toFixed(2));
        for (let i = 0; i < 3; i++) {
          const ph = ((((t - tOn) / 1.6 + i / 3) % 1) + 1) % 1;
          P.rings[i].c.setAttribute("r", (11 + (P.maxR - 11) * ph).toFixed(1));
          P.rings[i].c.setAttribute("stroke-opacity", (Math.min(1, P.rings[i].a * 1.6) * (1 - ph) * (0.6 + 0.4 * boost)).toFixed(3));
        }
      }

      // ---------- the six fires (lat, lon)
      const INDIA = [22.8, 78.6];
      const FIRES = [
        { id: "hormuz", ll: [26.6, 56.3], on: C.c02 + 0.3, cat: "oil" },
        { id: "punjab", ll: [30.92, 74.61], on: C.c03 + 0.3, cat: "border" },
        { id: "ladakh", ll: [34.76, 78.22], on: C.c04 + 0.6, cat: "border" },
        { id: "karakoram", ll: [36.12, 76.55], on: C.c04 + 1.5, cat: "border" },
        { id: "ukraine", ll: [49.0, 31.5], on: C.c05 + 0.3, cat: "oil" },
        { id: "taiwan", ll: [23.7, 121.0], on: C.c06 + 1.6, cat: "chip" },
      ];
      // fire counter steps (odometer) follow the pulses: 1 Hormuz, 2 Punjab, 3 Ladakh, 4 Karakoram, 5 Ukraine, 6 Taiwan
      const pulseLayer = document.getElementById("s01-pulses");
      const arcLayer = document.getElementById("s01-arcs");
      const CATCOL = { oil: "#fbbf24", border: "#ff6b6b", chip: "#2dd4bf" };
      // emphasis windows: petrol pump (oil), seema (border), phone (chip)
      const EMPH = { oil: [C.c10, C.c11 - 0.1], border: [C.c11, C.c12 - 0.1], chip: [C.c12, C.c13 + 0.6] };

      // smoke arcs: each fire -> India, a bowed curve lifted off the globe, drawn on at "har aag ka dhuaan"
      const N = 48;
      for (const [i, f] of FIRES.entries()) {
        const [la0, lo0] = f.ll, [la1, lo1] = INDIA;
        const dx = lo1 - lo0, dy = la1 - la0, len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len, bow = 0.14 * len * (i % 2 ? -1 : 1);
        f.arc = [];
        for (let j = 0; j <= N; j++) {
          const u = j / N, b = Math.sin(Math.PI * u) * bow;
          f.arc.push([la0 + dy * u + ny * b, lo0 + dx * u + nx * b, Math.sin(Math.PI * u) * 180000]);
        }
        f.arcOn = C.c09 + 0.3 + i * 0.28;
        f.base = el("path", { fill: "none", stroke: "#5eead4", "stroke-width": 2.5, "stroke-linecap": "round", "stroke-dasharray": "16 9", opacity: 0 }, arcLayer);
        f.hi = el("path", { fill: "none", stroke: CATCOL[f.cat], "stroke-width": 4.5, "stroke-linecap": "round", opacity: 0 }, arcLayer);
        f.pulse = makePulse(pulseLayer, 42);
      }

      const earth = await createEarth({ canvas: document.getElementById("earth"), assetBase: "./assets/geo/", regions: [] });
      const tl = gsap.timeline({ paused: true });

      driveWithTimeline(tl, DUR, (t) => {
        earth.render(camAt(CAM, t));
        // India's boundary is quiet until "Bharat tak pahunchta hai", then glows teal
        const ind = 0.28 + 0.72 * smooth(ramp(t, C.c09 + 2.4, 1.6));
        earth.setLineOpacity("india", ind);
        earth.setLineOpacity("india_glow", ind * (1 + 0.9 * smooth(ramp(t, C.c09 + 2.4, 1.6))));
        const arcFade = 1 - smooth(ramp(t, C.c14 - 0.2, 1.4));
        for (const f of FIRES) {
          const [ew0, ew1] = EMPH[f.cat];
          const emph = Math.min(smooth(ramp(t, ew0, 0.45)), 1 - smooth(ramp(t, ew1, 0.5)));
          drawPulse(f.pulse, earth.project(f.ll[0], f.ll[1], 0), t, f.on, 1, emph);
          // arc draw-on (only the visible part of the globe)
          const k = smooth(ramp(t, f.arcOn, 2.6));
          const a = arcFade * ramp(t, f.arcOn, 0.3);
          if (k <= 0 || a <= 0.002) { f.base.setAttribute("opacity", 0); f.hi.setAttribute("opacity", 0); continue; }
          const last = k * N, jn = Math.floor(last);
          let d = "", pen = false;
          for (let j = 0; j <= Math.min(N, jn + 1); j++) {
            let q = f.arc[j];
            if (j > last) { const p0 = f.arc[j - 1], fr = last - (j - 1); q = [p0[0] + (q[0] - p0[0]) * fr, p0[1] + (q[1] - p0[1]) * fr, p0[2] + (q[2] - p0[2]) * fr]; }
            const p = earth.project(q[0], q[1], q[2]);
            if (!p.visible) { pen = false; continue; }
            d += (pen ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1);
            pen = true;
          }
          f.base.setAttribute("d", d); f.hi.setAttribute("d", d);
          f.base.setAttribute("opacity", (0.78 * a).toFixed(3));
          f.base.setAttribute("stroke-dashoffset", (-t * 38).toFixed(1));
          f.hi.setAttribute("opacity", (0.95 * a * emph).toFixed(3));
        }
      });

      // ---------- text block (style A): kicker at "is waqt", the fire counter rides line 1, "EK BHARAT." on "Bharat tak pahunchta hai"
      tl.fromTo("#s01-scrim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, C.c01 + 0.6);
      tl.fromTo("#s01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, C.c01 + 0.8);
      tl.fromTo("#s01-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.c01 + 0.95);
      tl.fromTo("#s01-h1", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, FIRES[0].on);
      const odoAt = [FIRES[1].on, FIRES[2].on, FIRES[3].on, FIRES[4].on, FIRES[5].on];
      odoAt.forEach((at, i) => tl.to("#s01-odo", { yPercent: -100 * (i + 1) / 6, duration: 0.45, ease: "power3.out" }, at));
      tl.fromTo("#s01-h2", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, C.c09 + 0.5);
      tl.fromTo("#s01-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, C.c09 + 2.6);
      // slow settle push on the headline while it holds (never frozen)
      tl.fromTo("#s01-block", { scale: 1 }, { scale: 1.025, duration: C.c14 - C.c09, ease: "none", transformOrigin: "0% 50%" }, C.c09);
      // clear before the join (lines slide up into their masks)
      const X = C.c14 + 0.3;
      tl.to(["#s01-h1", "#s01-h2"], { yPercent: -100, duration: 0.4, ease: "power2.in", stagger: 0.08 }, X);
      tl.to("#s01-sub", { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" }, X);
      tl.to(["#s01-kick", "#s01-rule"], { opacity: 0, duration: 0.35, ease: "power2.in" }, X + 0.1);
      tl.to("#s01-scrim", { opacity: 0, duration: 0.8, ease: "power1.inOut" }, X + 0.3);

      window.__timelines["main"] = tl;
      done();
    </script>
  </body>
</html>
