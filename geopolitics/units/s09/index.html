    <style>

      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #earth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: visible; }
      #s09-scrim { opacity: 0; background: linear-gradient(90deg, rgba(4,9,27,.82) 0%, rgba(4,9,27,.82) 26%, rgba(4,9,27,.45) 42%, rgba(4,9,27,0) 55%); }
      .block { position: absolute; left: 96px; top: 138px; width: 1100px; }
      #s09-b0 { top: 560px; }
      .kicker { display: flex; align-items: center; gap: 16px; height: 30px; font: 700 28px/1 Inter; letter-spacing: 5px; color: #fbbf24; text-transform: uppercase;
                white-space: nowrap; margin-bottom: 22px; text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .kicker i { display: block; width: 44px; height: 6px; background: #fbbf24; transform-origin: left center; }
      .mask { overflow: hidden; padding-bottom: 4px; }
      .h { font: 400 150px/1.0 Anton; color: #f8fafc; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap;
           text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .h.xl { font-size: 186px; }
      .h.k { color: #ff6b6b; }
      .sub { font: 500 40px/1.25 Inter; color: rgba(226,232,240,.96); white-space: nowrap; height: 50px;
             text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37.69" data-width="1920" data-height="1080">

      <!-- map overlay above the scrim so the route, pins and arrows stay bright over the dark left side -->
      <svg class="full" id="s09-ov" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>

          <radialGradient id="s09-headglow"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.85" /><stop offset="1" stop-color="#fbbf24" stop-opacity="0" /></radialGradient>
        </defs>
        <g filter="url(#s09-ash)">

        </g>

        <g id="s09-pins"></g>
        <g filter="url(#s09-ash)">
          <path id="s09-arC" d="" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round" opacity="0" />

      <div class="credit">NASA Blue Marble &nbsp;·&nbsp; Sentinel-2 cloudless 2016 by EOX (CC BY 4.0) &nbsp;·&nbsp; DataMeet &nbsp;·&nbsp; Natural Earth</div>
    </div>

    <script type="module">
      import { createEarth, camAt, driveWithTimeline } from "./assets/geo/engine.js";
      import { typer, flagCards, env, sm, out3, backOut, prog, clamp01 } from "./assets/geo/fx.js";
      /*CUES*/ const CUES = {"c01": 0.35, "c02": 2.59, "c03": 8.94, "c04": 14.66, "c05": 21.02, "c06": 30.42, "c07": 32.27}; /*END CUES*/
      const DUR = /*DUR*/ 37.69 /*END DUR*/;
      /*SFX*/ const SFX = [[2.64, 0, "pop"], [4.29, 0, "type", 32], [7.15, 0, "impact"], [9.45, 0, "draw"], [9.62, 0, "pop"], [10.65, 0, "pop"], [13.3, 0, "pop"], [14.71, 0, "type", 16], [19.3, 0, "hit"], [20.95, 0, "zoom"], [21.33, 0, "type", 16], [23.61, 0, "type", 5], [24.29, 0, "type", 5], [27.95, 0, "impact"], [29.8, 0, "pop"], [31.27, 0, "pop"], [32.76, 0, "pop"], [33.56, 0, "pop"], [34.3, 0, "whoosh"]]; /*END SFX*/

      // ---------- word times (timing/s09_words.json): key beats sit on the spoken words
      const T_SHAK = 2.64;     // "शक्सगाम"
      const T_CHINA1 = 4.29;   // "China" (Pakistan Economic Corridor) -> typed kicker
      const T_CPEC = 7.23;     // "CPEC"
      const T_KASH = 9.59;     // "काशगर"
      const T_GIL = 10.63;     // "गिलगित"
      const T_GWA = 13.28;     // "ग्वादर"
      const T_BHARAT = 14.71;  // "भारत" (iska virodh)
      const T_ILAAKE = 17.79;  // "इलाके"
      const T_KABZE = 19.25;   // "जो" (Pakistan ke kabze mein hai)
      const T_CHINA2 = 21.33;  // "China" (aur Pakistan, ek saath)
      const T_SEEMA = 23.61;   // "सीमा"
      const T_SADAK = 24.29;   // "सड़क"
      const T_BHARAT2 = 26.15; // "भारत" (ke liye sawaal)
      const T_DO = 27.97;      // "दो" (morchon)
      const T_CHEEN = 29.79;   // "चीन"
      const T_PAK = 31.27;     // "पाकिस्तान"
      const T_LAD = 32.76;     // "लद्दाख"
      const T_KSH = 33.56;     // "कश्मीर"
      const T_ISLIYE = 32.32;  // "इसलिए" (suraksha ...)

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let done;
      window.__hf.buildReady["earth"] = new Promise((r) => (done = r));
      window.__timelines = window.__timelines || {};

      // ---------- camera: START (36.0, 76.6, 400) -> pull back over the whole CPEC -> slow push while it draws ->
      // zoom to the two-front view -> drift -> pull out to END (31, 70, 6000)
      const CAM = [
        { t: 0, lat: 36.0, lon: 76.6, alt: 400, tilt: 0, heading: 0 },
        { t: 9.3, lat: 32.3, lon: 69.4, alt: 4800, tilt: 0, heading: 0, ease: "inOut" },
        { t: 20.9, lat: 32.4, lon: 69.9, alt: 4550, tilt: 0, heading: 0, ease: "linear" },
        { t: 25.8, lat: 32.0, lon: 73.5, alt: 2950, tilt: 0, heading: 0, ease: "inOut" },
        { t: 34.3, lat: 31.8, lon: 73.2, alt: 2800, tilt: 0, heading: 0, ease: "linear" },
        { t: DUR, lat: 31.0, lon: 70.0, alt: 6000, tilt: 0, heading: 0, ease: "inOut" },
      ];

      const earth = await createEarth({ canvas: document.getElementById("earth"), assetBase: "./assets/geo/", regions: ["north", "karakoram"], world: true, india: true });
      await document.fonts.ready;

      const $ = (id) => document.getElementById(id);
      const SVGNS = "http://www.w3.org/2000/svg";
      const pinsG = $("s09-pins");
      const mk = (tag, attrs, parent = pinsG) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const onScreen = (p) => p.visible && p.x > -80 && p.x < 2000 && p.y > -80 && p.y < 1160;
      const f1 = (v) => v.toFixed(1);

      function mkPulse(color = "#ff6b6b") {
        const g = mk("g", { opacity: 0 });
        const rings = [0, 1, 2].map(() => mk("circle", { r: 11, fill: "none", stroke: color, "stroke-width": 2.5 }, g));
        mk("circle", { r: 11, fill: color }, g); mk("circle", { r: 4.5, fill: "#f8fafc" }, g);
        return { g, rings };
      }
      function drawPulse(P, p, a, t, t0) {
        const vis = onScreen(p) ? a : 0;
        P.g.setAttribute("opacity", vis.toFixed(3));
        if (vis <= 0.001) return;
        P.g.setAttribute("transform", `translate(${f1(p.x)},${f1(p.y)}) scale(${Math.max(0.001, backOut(prog(t, t0, 0.45))).toFixed(3)})`);
        const A = [0.59, 0.35, 0.2];
        P.rings.forEach((r, k) => {
          const ph = ((t + k * 0.5333) % 1.6) / 1.6;
          r.setAttribute("r", (11 + ph * 40).toFixed(2)); r.setAttribute("opacity", ((1 - ph) * A[k] * 1.6).toFixed(3));
        });
      }
      function mkPin(color) {
        const g = mk("g", { opacity: 0 });
        mk("circle", { r: 9, fill: color, stroke: "rgba(4,9,27,.7)", "stroke-width": 2 }, g); mk("circle", { r: 3.5, fill: "#04091b" }, g);
        return g;
      }
      // map label: pin pops at t0, leader draws, text fades in; dx < 0 puts the text left of the leader end
      function mkLabel(id, dx, dy) {
        return { el: $(id), dx, dy, line: mk("line", { stroke: "rgba(248,250,252,.8)", "stroke-width": 2, "stroke-linecap": "round", opacity: 0 }),
                 end: mk("circle", { r: 5, fill: "#f8fafc", opacity: 0 }) };
      }
      function drawLabel(L, p, a, t, t0) {
        const vis = onScreen(p) ? a : 0;
        const k = out3((t - t0 - 0.15) / 0.4), ex = p.x + L.dx * k, ey = p.y + L.dy * k;
        L.line.setAttribute("x1", f1(p.x)); L.line.setAttribute("y1", f1(p.y)); L.line.setAttribute("x2", f1(ex)); L.line.setAttribute("y2", f1(ey));
        L.line.setAttribute("opacity", (vis * (k > 0.01 ? 1 : 0)).toFixed(3));
        L.end.setAttribute("cx", f1(ex)); L.end.setAttribute("cy", f1(ey)); L.end.setAttribute("opacity", (vis * k).toFixed(3));
        L.el.style.opacity = (vis * sm((t - t0 - 0.45) / 0.35)).toFixed(3);
        L.el.style.transform = L.dx >= 0 ? `translate(${f1(ex + 14)}px, ${f1(ey - 14)}px)` : `translate(${f1(ex - 14)}px, ${f1(ey - 14)}px) translateX(-100%)`;
      }

      // ---------- CPEC route (SVG over the scrim): Kashgar -> Gilgit-Baltistan -> Gwadar, drawn as the voice names the places
      const CPEC = [[75.99, 39.47], [75.42, 36.85], [74.31, 35.92], [73.2, 34.2], [73.05, 33.68], [71.5, 30.2], [67.0, 27.5], [64.0, 25.6], [62.32, 25.13]];
      // part of the route inside India's boundary (PoK / Gilgit-Baltistan): crossings of the DataMeet line computed offline
      const POK = [[75.427, 36.884], [75.42, 36.85], [74.31, 35.92], [73.855, 35.215]];
      const cumOf = (P) => { const c = [0]; for (let i = 1; i < P.length; i++) { const a = P[i - 1], b = P[i];
        c.push(c[i - 1] + Math.hypot((b[0] - a[0]) * Math.cos(((a[1] + b[1]) / 2) * Math.PI / 180), b[1] - a[1])); } return c; };
      const CUM = cumOf(CPEC), CUMP = cumOf(POK);
      const partial = (P, C, f) => { // [lon,lat] points of the first fraction f of polyline P
        const d = clamp01(f) * C[C.length - 1], out = [P[0]];
        for (let i = 1; i < P.length; i++) {
          if (C[i] <= d) { out.push(P[i]); continue; }
          const k = (d - C[i - 1]) / Math.max(1e-9, C[i] - C[i - 1]);
          out.push([P[i - 1][0] + (P[i][0] - P[i - 1][0]) * k, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * k]); break;
        }
        return out;
      };
      const pathOf = (pts) => pts.map((q, i) => { const p = earth.project(q[1], q[0], 0); return (i ? "L" : "M") + f1(p.x) + "," + f1(p.y); }).join(" ");
      // draw curve: Hermite keys so the head reaches Gilgit on "Gilgit" and Gwadar on "Gwadar"
      const F_GIL = CUM[2] / CUM[CUM.length - 1];
      const T_D0 = 9.45, T_DG = 10.65, T_DW = 13.3;
      const herm = (s, f0, v0, f1v, v1, h) => { const s2 = s * s, s3 = s2 * s;
        return (2 * s3 - 3 * s2 + 1) * f0 + (s3 - 2 * s2 + s) * h * v0 + (-2 * s3 + 3 * s2) * f1v + (s3 - s2) * h * v1; };
      const drawF = (t) => t <= T_D0 ? 0 : t >= T_DW ? 1 : t < T_DG ? herm((t - T_D0) / (T_DG - T_D0), 0, 0, F_GIL, 0.3, T_DG - T_D0)
                                                          : herm((t - T_DG) / (T_DW - T_DG), F_GIL, 0.3, 1, 0, T_DW - T_DG);
      const route = $("s09-route"), pok = $("s09-pok"), head = $("s09-head");

      // ---------- pins + labels
      const pShak = mkPulse(), lShak = mkLabel("s09-l-shak", -60, 56);
      const pinKash = mkPin("#fbbf24"), lKash = mkLabel("s09-l-kash", 56, 26);
      const pinGil = mkPin("#f8fafc"), lGil = mkLabel("s09-l-gil", 70, -30);
      const pinGwa = mkPin("#fbbf24"), lGwa = mkLabel("s09-l-gwa", 58, -50);
      const pPok = mkPulse();
      const lSeema = mkLabel("s09-l-seema", 80, -20), lSadak = mkLabel("s09-l-sadak", -80, 40);
      const pinLad = mkPin("#2dd4bf"), lLad = mkLabel("s09-l-lad", 50, 130);
      const pinKsh = mkPin("#2dd4bf"), lKsh = mkLabel("s09-l-ksh", -58, 50);
      const T_B1_OUT = 20.75;
      const LABS = [
        { ll: [36.12, 76.55], L: lShak, t0: T_SHAK, t1: 8.6 },
        { ll: [39.47, 75.99], pin: pinKash, L: lKash, t0: T_KASH, t1: T_B1_OUT },
        { ll: [35.92, 74.31], pin: pinGil, L: lGil, t0: T_GIL, t1: T_B1_OUT },
        { ll: [25.13, 62.32], pin: pinGwa, L: lGwa, t0: T_GWA, t1: T_B1_OUT },
        { ll: [36.12, 76.55], L: lSeema, t0: T_SEEMA - 0.45, t1: 27.5 },
        { ll: [35.5, 74.6], L: lSadak, t0: T_SADAK - 0.45, t1: 27.5 },
        { ll: [34.15, 77.58], pin: pinLad, L: lLad, t0: T_LAD, t1: 36.3 },
        { ll: [34.08, 74.8], pin: pinKsh, L: lKsh, t0: T_KSH, t1: 36.3 },
      ];
      const typers = [
        typer($("s09-b1-kick"), "China Pakistan Economic Corridor", T_CHINA1, { t1: T_B1_OUT + 0.35 }),
        typer($("s09-b1-sub"), "Bharat ka virodh", T_BHARAT, { t1: T_B1_OUT + 0.35 }),
        typer($("s09-b2-kick"), "China + Pakistan", T_CHINA2, { t1: 36.7 }),
        typer($("s09-l-seema"), "Seema", T_SEEMA),
        typer($("s09-l-sadak"), "Sadak", T_SADAK),
      ];

      // ---------- two pressure arrows closing on India + flag cards on "China" / "Pakistan"
      const ARROWS = [
        { path: $("s09-arC"), hd: $("s09-hdC"), a: [36.6, 84.4], b: [35.6, 80.8], c: [33.9, 79.3], t0: T_CHEEN - 0.35 },
        { path: $("s09-arP"), hd: $("s09-hdP"), a: [29.6, 69.6], b: [30.7, 71.8], c: [31.0, 73.9], t0: T_PAK - 0.35 },
      ];
      const T_ARR_OUT = 36.3;
      function drawArrow(A, t) {
        const p = sm(clamp01((t - A.t0) / 1.1));
        const vis = (p > 0.001 ? 1 : 0) * (1 - sm(clamp01((t - T_ARR_OUT) / 0.6)));
        if (vis <= 0.001) { A.path.setAttribute("opacity", "0"); A.hd.setAttribute("opacity", "0"); return; }
        const P0 = earth.project(A.a[0], A.a[1], 0), P1 = earth.project(A.b[0], A.b[1], 0), P2 = earth.project(A.c[0], A.c[1], 0);
        const q0x = P0.x + (P1.x - P0.x) * p, q0y = P0.y + (P1.y - P0.y) * p, q1x = P1.x + (P2.x - P1.x) * p, q1y = P1.y + (P2.y - P1.y) * p;
        const bx = q0x + (q1x - q0x) * p, by = q0y + (q1y - q0y) * p, ang = Math.atan2(q1y - q0y, q1x - q0x);
        A.path.setAttribute("d", `M${f1(P0.x)},${f1(P0.y)} Q${f1(q0x)},${f1(q0y)} ${f1(bx - Math.cos(ang) * 20)},${f1(by - Math.sin(ang) * 20)}`);
        A.path.setAttribute("opacity", vis.toFixed(3));
        A.hd.setAttribute("transform", `translate(${f1(bx - Math.cos(ang) * 22)},${f1(by - Math.sin(ang) * 22)}) rotate(${(ang * 180 / Math.PI).toFixed(2)})`);
        A.hd.setAttribute("opacity", (vis * clamp01(p * 6)).toFixed(3));
      }
      const cards = flagCards({ html: $("s09-cards"), svg: $("s09-csvg"), items: [
        { flags: ["cn"], title: "China", lat: 35.2, lon: 82.0, x: 1590, y: 420, t0: T_CHEEN - 0.35, t1: 36.6, color: "#ff6b6b" },
        { flags: ["pk"], title: "Pakistan", lat: 29.6, lon: 69.6, x: 96, y: 780, t0: T_PAK - 0.35, t1: 36.6, color: "#ff6b6b" },
      ] });

      // India's boundary breathes on "Bharat" and through the last beat (suraksha / ek tasveer)
      const glow = (t) => Math.max(env(t, T_BHARAT, 16.8, 0.5), env(t, T_BHARAT2, 27.8, 0.5),
        env(t, T_ISLIYE, 36.8, 0.8) * (0.55 + 0.45 * Math.sin((t - T_ISLIYE) * 3.2)));

      const tl = gsap.timeline({ paused: true });
      driveWithTimeline(tl, DUR, (t) => {
        const cam = camAt(CAM, t);
        earth.setLineOpacity("india_glow", 1 + 2.2 * glow(t));
        earth.render(cam);

        // CPEC route + travelling head; the PoK stretch turns coral on "jo Pakistan ke kabze mein hai"
        const f = drawF(t), rOut = 1 - sm(clamp01((t - 36.4) / 0.8));
        route.setAttribute("d", f > 0.0005 ? pathOf(partial(CPEC, CUM, f)) : "");
        route.setAttribute("opacity", (f > 0.0005 ? rOut : 0).toFixed(3));
        const hv = (f > 0.0005 && f < 0.999 ? 1 : 0) * (1 - sm(clamp01((t - T_DW + 0.25) / 0.3)));
        if (hv > 0) { const q = partial(CPEC, CUM, f).pop(), hp = earth.project(q[1], q[0], 0); head.setAttribute("transform", `translate(${f1(hp.x)},${f1(hp.y)})`); }
        head.setAttribute("opacity", hv.toFixed(3));
        const fp = out3(prog(t, T_KABZE + 0.05, 0.8));
        pok.setAttribute("d", fp > 0.0005 ? pathOf(partial(POK, CUMP, fp)) : "");
        pok.setAttribute("opacity", (fp > 0.0005 ? rOut : 0).toFixed(3));

        // pulses: Shaksgam (opening), PoK / Gilgit-Baltistan ("us ilaake"), Shaksgam again on "seema"
        const ps = earth.project(36.12, 76.55, 0);
        const aShak = Math.max(env(t, 0.3, 8.6, 0.4), env(t, T_SEEMA - 0.45, 27.5, 0.35));
        drawPulse(pShak, ps, aShak, t, t < 15 ? 0.3 : T_SEEMA - 0.45);
        drawPulse(pPok, earth.project(35.7, 74.7, 0), env(t, T_ILAAKE, T_B1_OUT + 0.2, 0.35), t, T_ILAAKE);

        for (const ty of typers) ty.update(t);
        for (const it of LABS) {
          const p = earth.project(it.ll[0], it.ll[1], 0), a = env(t, it.t0, it.t1, 0.35);
          if (it.pin) {
            const vis = onScreen(p) ? a : 0;
            it.pin.setAttribute("opacity", vis.toFixed(3));
            if (vis > 0.001) it.pin.setAttribute("transform", `translate(${f1(p.x)},${f1(p.y)}) scale(${Math.max(0.001, backOut(prog(t, it.t0, 0.45))).toFixed(3)})`);
          }
          drawLabel(it.L, p, a, t, it.t0);
        }
        for (const A of ARROWS) drawArrow(A, t);
        cards.update(t, earth);
      });

      // ---------- text blocks: every block enters and leaves as one unit, nothing is left behind (no ghost opacity)
      const lineIn = (sel, at) => tl.fromTo(sel, { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, at);
      const lineOut = (sel, at) => tl.fromTo(sel, { yPercent: 0 }, { yPercent: -105, duration: 0.4, ease: "power2.in", immediateRender: false }, at);
      const ruleIn = (sel, at) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, at);
      const ruleOut = (sel, at) => tl.fromTo(sel, { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, at);
      const fadeIn = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, at);
      const fadeOut = (sel, at) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, at);

      // one scrim for the whole chapter (no dips between blocks), clear at both joins
      tl.fromTo("#s09-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.4);
      tl.fromTo("#s09-scrim", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.in", immediateRender: false }, 36.4);

      // B0 "SIRF EK GHAATI / KI BAAT NAHI." : both lines rise together and leave together before the CPEC kicker types
      ruleIn("#s09-b0-rule", 0.45); fadeIn("#s09-b0-kick", 0.55);
      lineIn("#s09-b0-h1", 0.55); lineIn("#s09-b0-h2", 0.67);
      lineOut("#s09-b0-h1", 3.85); lineOut("#s09-b0-h2", 3.89); fadeOut("#s09-b0-kick", 3.85); ruleOut("#s09-b0-rule", 3.85);
      tl.fromTo("#s09-b0", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.05, immediateRender: false }, 4.3);

      // B1 CPEC: typed kicker on the spoken name, CPEC rises on "CPEC", typed "Bharat ka virodh", hard "POK SE HOKAR" on "kabze"
      ruleIn("#s09-b1-rule", T_CHINA1 - 0.2);
      lineIn("#s09-b1-h1", T_CPEC - 0.08);
      tl.fromTo("#s09-b1-kw", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, T_KABZE + 0.05);
      lineOut("#s09-b1-h1", T_B1_OUT); fadeOut("#s09-b1-kw", T_B1_OUT); ruleOut("#s09-b1-rule", T_B1_OUT);
      tl.fromTo("#s09-b1", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.05, immediateRender: false }, T_B1_OUT + 0.45);

      // B2 (approved still): typed "China + Pakistan" kicker, DO / MORCHE. rise together on "do morchon", subs swap, all out together
      ruleIn("#s09-b2-rule", T_CHINA2 - 0.2);
      lineIn("#s09-b2-h1", T_DO - 0.08); lineIn("#s09-b2-h2", T_DO + 0.04);
      fadeIn("#s09-b2-s1", 28.7); fadeOut("#s09-b2-s1", 33.45);
      fadeIn("#s09-b2-s2", T_KSH + 0.25);
      lineOut("#s09-b2-h1", 36.3); lineOut("#s09-b2-h2", 36.34); fadeOut("#s09-b2-s2", 36.3); ruleOut("#s09-b2-rule", 36.3);

      window.__timelines["main"] = tl;
      done();
    </script>
  </body>
</html>
