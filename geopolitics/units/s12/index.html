<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.min.js", "three/addons/": "./assets/vendor/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #04070f; }
      #earth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .s12-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
      #s12-scrim { background: linear-gradient(90deg, rgba(4,9,27,.80) 0%, rgba(4,9,27,.80) 22%, rgba(4,9,27,0) 50%); opacity: 0; }
      #s12-glow { position: absolute; left: 0; top: 0; width: 440px; height: 440px; margin: -220px 0 0 -220px; border-radius: 50%;
                  background: radial-gradient(closest-side, rgba(45,212,191,.42), rgba(45,212,191,.16) 45%, rgba(45,212,191,0) 100%);
                  mix-blend-mode: screen; opacity: 0; }
      .s12-sh { text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      /* legend: fixed grid, swatch 36x6 + 18 px gap + text, rows 46 px apart; the swatch never leaves its own box */
      .s12-lrow { position: absolute; left: 96px; height: 36px; overflow: hidden; }
      .s12-lin { position: relative; height: 36px; }
      .s12-lin i { position: absolute; left: 0; top: 15px; width: 36px; height: 6px; border-radius: 3px; transform-origin: left center; }
      .s12-lin span { position: absolute; left: 54px; top: 0; line-height: 36px; font: 700 26px Inter; letter-spacing: 4px; text-transform: uppercase; white-space: nowrap; }
      .s12-oil i { background: #fbbf24; } .s12-oil span { color: #fbbf24; }
      .s12-bor i { background: #ff6b6b; } .s12-bor span { color: #ff6b6b; }
      .s12-trd i { background: #2dd4bf; } .s12-trd span { color: #2dd4bf; }
      .s12-krow { position: absolute; left: 96px; top: 640px; display: flex; align-items: center; gap: 16px; height: 36px; font: 700 28px Inter; letter-spacing: 5px;
                  color: #fbbf24; text-transform: uppercase; white-space: nowrap; }
      .s12-krow i { display: block; width: 44px; height: 6px; background: #fbbf24; transform-origin: left center; }
      .s12-mask { position: absolute; left: 96px; overflow: hidden; }
      .s12-h { font: 400 144px/1.0 Anton; color: #f8fafc; text-transform: uppercase; white-space: nowrap; padding-bottom: 2px; }
      .s12-k { color: #ff6b6b; }
      #s12-credit { position: absolute; left: 0; right: 0; top: 1028px; text-align: center; font: 600 20px Inter; color: #cbd5e1; letter-spacing: 1px; opacity: 0;
                    text-shadow: 0 2px 3px rgba(2,6,16,.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27.82" data-width="1920" data-height="1080">
      <canvas id="earth"></canvas>
      <div class="s12-full" id="s12-scrim"></div>
      <div id="s12-glow"></div>
      <svg class="s12-full" id="s12-fx" width="1920" height="1080" viewBox="0 0 1920 1080">
        <g id="s12-lines"></g><g id="s12-pulses"></g>
      </svg>
      <div class="s12-full" id="s12-cards"></div>
      <svg class="s12-full" id="s12-cardsvg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

      <!-- legend (mid-left, clear of Hormuz and the arcs) -->
      <div class="s12-lrow" style="top:404px;width:460px"><div class="s12-lin s12-oil" id="s12-r0"><i id="s12-sw0"></i><span>Tel ke raaste</span></div></div>
      <div class="s12-lrow" style="top:450px;width:460px"><div class="s12-lin s12-bor" id="s12-r1"><i id="s12-sw1"></i><span>Seema ke raaste</span></div></div>
      <div class="s12-lrow" style="top:496px;width:460px"><div class="s12-lin s12-trd" id="s12-r2"><i id="s12-sw2"></i><span>Vyapaar ke raaste</span></div></div>
      <!-- kicker + headline (bottom-left, over the Arabian Sea: India stays clear) -->
      <div class="s12-krow s12-sh"><i id="s12-rule"></i><span id="s12-kick"></span></div>
      <div class="s12-mask" style="top:686px"><div class="s12-h s12-sh" id="s12-h1">6 Chunautiyan</div></div>
      <div class="s12-mask" style="top:830px"><div class="s12-h s12-k s12-sh" id="s12-h2">Ek Bharat.</div></div>
      <div id="s12-credit">NASA Blue Marble &nbsp;·&nbsp; Borders: DataMeet, Natural Earth (India view)</div>
    </div>
    <script type="module">
      import { createEarth, camAt, driveWithTimeline } from "./assets/geo/engine.js";
      import { typer, flagCards, env, sm, out3, inOut, backOut, prog } from "./assets/geo/fx.js";
      /*CUES*/ const CUES = {"c01": 0.35, "c02": 3.15, "c03": 6.84, "c04": 9.55, "c05": 14.03, "c06": 16.71, "c07": 19.27, "c08": 20.81, "c09": 23.72}; /*END CUES*/
      const DUR = /*DUR*/ 27.82 /*END DUR*/;
      /*SFX*/ const SFX = [[0.9, 0, "type", 13], [1.95, 0, "pop"], [3.55, 0, "pop"], [4.12, 0, "draw"], [7.24, 0, "pop"], [8.23, 0, "draw"], [9.95, 0, "pop"], [10.52, 0, "draw"], [11.38, 0, "draw"], [14.43, 0, "pop"], [15.53, 0, "draw"], [17.31, 0, "pop"], [17.95, 0, "draw"], [19.32, 0, "impact"], [22.33, 0, "heartbeat"], [23.77, 0, "draw", null, -28], [25.04, 0, "draw", null, -28], [26.44, 0, "draw", null, -28]]; /*END SFX*/

      // Word times (timing/s12_words.json)
      const W_POORI = 0.9, W_EKSAATH = 1.9;               // "पूरी", "एक साथ"
      const W_HORMUZ = 3.2, W_TEL = 4.12;                 // "Hormuz", "तेल"
      const W_PAK = 6.89, W_SEEMA = 8.23;                 // "पाकिस्तान", "सीमा"
      const W_CHINA = 9.6, W_LADAKH = 10.52, W_SHAKS = 11.38, W_DABAAV = 13.08; // "China", "लद्दाख", "शक्सगाम", "दबाव"
      const W_RUSSIA = 14.08, W_TARIFF = 15.53;           // "Russia", "tariff"
      const W_TAIWAN = 16.96, W_CHIP = 17.95;             // "Taiwan", "chip"
      const W_CHHE = 19.32, W_LEKIN = 20.86, W_BHARAT = 22.33; // "छह", "लेकिन", "भारत"
      const W_R_TEL = 23.77, W_R_SEEMA = 25.04, W_R_VYA = 26.44; // "तेल / सीमा / व्यापार के रास्ते"
      const TP = 53.57; // s11 duration: pulse / glow phases continue across the join (s11 uses chapter t)

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      let done;
      window.__hf.buildReady["earth"] = new Promise((r) => (done = r));

      // One continuous camera: START 24,95,9000 -> "poori tasveer": pull out west over India -> slow drift out -> END 27,70,16000
      const CAM = [
        { t: 0, lat: 24, lon: 95, alt: 9000 },
        { t: 5.6, lat: 26.6, lon: 72.5, alt: 14400, ease: "inOut" },
        { t: DUR, lat: 27, lon: 70, alt: 16000, ease: "linear" },
      ];
      const earth = await createEarth({ canvas: document.getElementById("earth"), assetBase: "./assets/geo/", regions: [] });

      const NS = "http://www.w3.org/2000/svg", D = Math.PI / 180;
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const $ = (id) => document.getElementById(id);
      const bell = (t, a, d) => { const x = (t - a) / d; return x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x); };
      const AMBER = "#fbbf24", CORAL = "#ff6b6b", TEAL = "#2dd4bf";
      const toV = (lat, lon) => [Math.cos(lat * D) * Math.cos(lon * D), Math.cos(lat * D) * Math.sin(lon * D), Math.sin(lat * D)];
      function gcAng(a, b) { const A = toV(a[0], a[1]), B = toV(b[0], b[1]); return Math.acos(Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]))); }
      function gc(a, b, k, w) {
        const A = toV(a[0], a[1]), B = toV(b[0], b[1]), s = Math.sin(w), f1 = Math.sin((1 - k) * w) / s, f2 = Math.sin(k * w) / s;
        const v = [A[0] * f1 + B[0] * f2, A[1] * f1 + B[1] * f2, A[2] * f1 + B[2] * f2];
        return [Math.asin(v[2]) / D, Math.atan2(v[1], v[0]) / D];
      }

      // ---------- six fires (pins) ----------
      const PINS = [
        { id: "hormuz", lat: 26.6, lon: 56.3 }, { id: "ferozepur", lat: 30.92, lon: 74.61 }, { id: "lac", lat: 34.76, lon: 78.22 },
        { id: "shaksgam", lat: 36.12, lon: 76.55 }, { id: "ukraine", lat: 49.0, lon: 31.5 }, { id: "taiwan", lat: 23.7, lon: 121.0 },
      ];
      const gPul = $("s12-pulses"), gLines = $("s12-lines");
      PINS.forEach((p, i) => {
        p.g = mk("g", { opacity: 0 }, gPul);
        p.rings = [0, 1, 2].map(() => mk("circle", { r: 13, fill: "none", stroke: CORAL, "stroke-width": 3 }, p.g));
        mk("circle", { r: 11, fill: CORAL }, p.g); mk("circle", { r: 4.5, fill: "#f8fafc" }, p.g);
        p.pop = p.id === "taiwan" ? -1 : W_EKSAATH + i * 0.1; // Taiwan carries over lit from s11
        p.ping = W_CHHE + i * 0.12;                            // "chhe": the six flash in turn
      });

      // ---------- arcs: each family lands on its own Indian point (no fan) ----------
      // oil: Hormuz -> Jamnagar refinery coast; trade: Ukraine (tariff) -> Bhopal (heart of India), Taiwan (chips) -> Chennai (electronics hub).
      // (Delhi would run straight over the Ferozepur pin, Dholera sits 37 px from Jamnagar at this zoom.)
      const ARCS = [
        { a: [26.6, 56.3], b: [22.3, 70.0], col: AMBER, fam: 0, draw: W_TEL, dur: 1.2 },
        { a: [49.0, 31.5], b: [23.26, 77.41], col: TEAL, fam: 2, draw: W_TARIFF, dur: 1.2 },
        { a: [23.7, 121.0], b: [13.08, 80.27], col: TEAL, fam: 2, draw: W_CHIP, dur: 1.3 },
      ];
      const N = 48;
      for (const A of ARCS) {
        A.w = gcAng(A.a, A.b); A.h = 0.1 * A.w * 6371000;
        A.pts = Array.from({ length: N + 1 }, (_, i) => gc(A.a, A.b, i / N, A.w));
        A.glow = mk("path", { d: "", fill: "none", stroke: A.col, "stroke-width": 9, "stroke-opacity": 0.16, "stroke-linecap": "round", "stroke-linejoin": "round" }, gLines);
        A.path = mk("path", { d: "", fill: "none", stroke: A.col, "stroke-width": 2.75, "stroke-linecap": "round", "stroke-linejoin": "round" }, gLines);
        A.ring = mk("circle", { r: 6, fill: "none", stroke: A.col, "stroke-width": 3, opacity: 0 }, gLines);
        A.end = mk("circle", { r: 5, fill: A.col, stroke: "#f8fafc", "stroke-width": 1.5, opacity: 0 }, gLines);
        A.spark = mk("circle", { r: 4.5, fill: "#f8fafc", opacity: 0 }, gLines);
        A.sparkH = mk("circle", { r: 10, fill: A.col, "fill-opacity": 0.35, opacity: 0 }, gLines);
      }
      // ---------- border family: India's own boundary near each hotspot glows coral (DataMeet ring, downsampled) ----------
      const STRETCH = [
        { c: 13, draw: W_SEEMA, dur: 0.9, pts: [[73.807,30.068],[73.931,30.32],[73.927,30.439],[73.964,30.485],[74.012,30.534],[74.057,30.519],[74.073,30.555],[74.118,30.608],[74.193,30.665],[74.261,30.775],[74.32,30.847],[74.366,30.893],[74.429,30.931],[74.546,30.992],[74.597,31.038],[74.689,31.128],[74.631,31.133],[74.571,31.081],[74.51,31.132],[74.533,31.249],[74.526,31.312],[74.584,31.379],[74.639,31.444],[74.637,31.485],[74.613,31.527],[74.535,31.678],[74.559,31.758],[74.607,31.89],[74.719,31.924],[74.755,31.956],[74.88,32.032],[74.934,32.066],[75.105,32.059],[75.198,32.083],[75.279,32.117],[75.316,32.208],[75.321,32.297]] },
        { c: 5, draw: W_LADAKH, dur: 1.0, pts: [[77.209,35.71],[77.421,35.64],[77.509,35.58],[77.519,35.486],[77.688,35.453],[77.911,35.462],[78.04,35.587],[78.181,35.601],[78.244,35.725],[78.608,35.815],[79.011,35.931],[79.343,35.988],[79.489,35.849],[79.572,35.813],[79.679,35.7],[79.846,35.575],[79.965,35.575],[80.11,35.478],[80.264,35.568],[80.412,35.477],[80.266,35.296],[80.223,35.171],[80.186,34.947],[80.074,34.706],[79.802,34.589],[79.702,34.486],[79.538,34.479],[79.603,34.307],[79.43,34.061],[79.225,34.011],[78.995,34.037],[79.028,33.754],[79.004,33.607],[78.963,33.339],[79.107,33.2],[79.256,33.215],[79.399,33.14],[79.332,33.001],[79.391,32.917],[79.543,32.73],[79.413,32.52],[79.248,32.517],[79.126,32.422],[78.968,32.336]] },
        { c: 19, draw: W_SHAKS, dur: 0.8, pts: [[74.735,37.038],[74.793,37.057],[74.843,37.024],[74.939,36.948],[74.937,36.992],[75.033,37.026],[75.146,37.034],[75.169,36.999],[75.282,36.983],[75.394,36.928],[75.426,36.784],[75.504,36.749],[75.54,36.78],[75.736,36.753],[75.941,36.606],[75.998,36.502],[76.149,36.425],[76.319,36.33],[76.429,36.239],[76.568,36.19],[76.719,36.16],[76.779,36.04],[76.839,35.859],[77.069,35.78],[77.209,35.71]] },
      ];
      for (const S of STRETCH) {
        S.glow = mk("path", { d: "", fill: "none", stroke: CORAL, "stroke-width": 9, "stroke-opacity": 0.22, "stroke-linecap": "round", "stroke-linejoin": "round" }, gLines);
        S.path = mk("path", { d: "", fill: "none", stroke: CORAL, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, gLines);
      }
      const glow = $("s12-glow");
      const wave = mk("circle", { r: 0, fill: "none", stroke: TEAL, "stroke-width": 3, opacity: 0 }, gLines);
      const HUB = [22.6, 79.4];

      // ---------- flag cards on each country mention (all gone before the headline) ----------
      const cards = flagCards({ html: $("s12-cards"), svg: $("s12-cardsvg"), items: [
        { flags: ["ir"], title: "Hormuz", sub: "Tel · rupaya", lat: 26.6, lon: 56.3, x: 780, y: 700, t0: W_HORMUZ, t1: 6.7 },
        { flags: ["pk"], title: "Pakistan", sub: "Seema", lat: 30.2, lon: 71.5, x: 560, y: 250, t0: W_PAK, t1: 9.5 },
        { flags: ["cn"], title: "China", sub: "Ladakh · Shaksgam", lat: 35.5, lon: 86.0, x: 1300, y: 200, t0: W_CHINA, t1: 13.75 },
        { flags: ["ru", "ua"], title: "Russia · Ukraine", sub: "Tariff", lat: 49.0, lon: 31.5, x: 760, y: 96, t0: W_RUSSIA, t1: 16.75 },
        { flags: ["tw"], title: "Taiwan", sub: "Chip supply", lat: 23.7, lon: 121.0, x: 1300, y: 290, t0: W_TAIWAN, t1: 20.6 },
      ] });
      const kick = typer($("s12-kick"), "POORI TASVEER", W_POORI, { t1: 26.9 });
      const FAM_FLARE = [W_R_TEL, W_R_SEEMA, W_R_VYA];
      const FLOW0 = W_LEKIN, FLOW1 = 23.6; // sparks travel into India on "lekin sabka asar ... Bharat tak aata hai"

      const tl = gsap.timeline({ paused: true });
      driveWithTimeline(tl, DUR, (t) => {
        earth.render(camAt(CAM, t));
        const tp = t + TP, ph = (tp % 1.6) / 1.6, breathe = 1 + 0.06 * Math.sin(ph * Math.PI * 2);
        for (const p of PINS) {
          const s = earth.project(p.lat, p.lon, 0);
          const pop = p.pop < 0 ? 1 : backOut(prog(t, p.pop, 0.55));
          const ping = 1 + 0.45 * bell(t, p.ping, 0.45);
          p.g.setAttribute("transform", `translate(${s.x.toFixed(1)},${s.y.toFixed(1)}) scale(${(pop * breathe * ping).toFixed(4)})`);
          p.g.setAttribute("opacity", s.visible && pop > 0.001 ? Math.min(1, pop).toFixed(3) : 0);
          p.rings.forEach((c, k) => {
            const q = (ph + k / 3) % 1;
            c.setAttribute("r", (13 + q * 34).toFixed(2));
            c.setAttribute("stroke-opacity", ((1 - q) * [0.59, 0.35, 0.2][k] * 1.3).toFixed(3));
          });
        }
        // arcs (draw-on by building the path up to the progress point: the head stays exact as the globe moves)
        for (const A of ARCS) {
          const pr = inOut((t - A.draw) / A.dur);
          const fl = bell(t, FAM_FLARE[A.fam], 1.2);
          if (pr <= 0.001) { A.path.setAttribute("d", ""); A.glow.setAttribute("d", ""); A.end.setAttribute("opacity", 0); A.ring.setAttribute("opacity", 0); A.spark.setAttribute("opacity", 0); A.sparkH.setAttribute("opacity", 0); continue; }
          const n = Math.max(1, Math.ceil(N * pr));
          let d = "", pen = false;
          const P = [];
          for (let i = 0; i <= N; i++) {
            const k = i / N, p = earth.project(A.pts[i][0], A.pts[i][1], Math.sin(Math.PI * k) * A.h);
            P.push(p);
            if (i > n) continue;
            if (!p.visible) { pen = false; continue; }
            let x = p.x, y = p.y;
            if (i === n && k > pr) { const q = P[i - 1], f = (pr - (i - 1) / N) * N; x = q.x + (p.x - q.x) * f; y = q.y + (p.y - q.y) * f; }
            d += (pen ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); pen = true;
          }
          A.path.setAttribute("d", d); A.glow.setAttribute("d", d);
          A.path.setAttribute("stroke-width", (2.75 + 1.6 * fl).toFixed(2));
          A.glow.setAttribute("stroke-opacity", (0.16 + 0.2 * fl).toFixed(3));
          const e = P[N], landed = prog(t, A.draw + A.dur, 0.9);
          A.end.setAttribute("cx", e.x.toFixed(1)); A.end.setAttribute("cy", e.y.toFixed(1)); A.end.setAttribute("opacity", landed > 0 ? Math.min(1, landed * 4).toFixed(3) : 0);
          A.ring.setAttribute("cx", e.x.toFixed(1)); A.ring.setAttribute("cy", e.y.toFixed(1));
          A.ring.setAttribute("r", (6 + 24 * out3(landed)).toFixed(1)); A.ring.setAttribute("opacity", landed > 0 && landed < 1 ? (0.9 * (1 - landed)).toFixed(3) : 0);
          // sparks: flow into India on "lekin ... Bharat tak", plus one comet per family flare
          let u = -1, sa = 0;
          if (t >= FLOW0 && t < FLOW1) { u = ((t - FLOW0) / 1.3) % 1; sa = Math.sin(Math.PI * u); }
          const ft = (t - FAM_FLARE[A.fam]) / 0.9;
          if (ft >= 0 && ft < 1) { u = inOut(ft); sa = Math.sin(Math.PI * ft); }
          if (u >= 0) {
            const i = Math.min(N - 1, Math.floor(u * N)), f = u * N - i, a = P[i], b = P[i + 1];
            const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
            for (const s of [A.spark, A.sparkH]) { s.setAttribute("cx", x.toFixed(1)); s.setAttribute("cy", y.toFixed(1)); s.setAttribute("opacity", sa.toFixed(3)); }
          } else { A.spark.setAttribute("opacity", 0); A.sparkH.setAttribute("opacity", 0); }
        }
        // coral boundary stretches: draw outward from the hotspot both ways; press on "dabaav", flare on "seema ke raaste"
        const press = 0.5 * bell(t, W_DABAAV, 1.0) + bell(t, W_R_SEEMA, 1.2) + 0.6 * bell(t, FLOW0, 2.4);
        for (const S of STRETCH) {
          const pr = inOut((t - S.draw) / S.dur);
          if (pr <= 0.001) { S.path.setAttribute("d", ""); S.glow.setAttribute("d", ""); continue; }
          const L = S.pts.length, i0 = Math.round(S.c - S.c * pr), i1 = Math.round(S.c + (L - 1 - S.c) * pr);
          let d = "", pen = false;
          for (let i = i0; i <= i1; i++) {
            const p = earth.project(S.pts[i][1], S.pts[i][0], 0);
            if (!p.visible) { pen = false; continue; }
            d += (pen ? "L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1); pen = true;
          }
          S.path.setAttribute("d", d); S.glow.setAttribute("d", d);
          S.path.setAttribute("stroke-width", (3 + 1.5 * press).toFixed(2));
          S.glow.setAttribute("stroke-width", (9 + 6 * press).toFixed(2));
        }
        // India: one teal glow lights on "Bharat" (with one wave) and breathes; it carries into s13
        const hub = earth.project(HUB[0], HUB[1], 0);
        const gk = 0.6 * out3(prog(t, W_BHARAT - 0.2, 1.4)) * (1 + 0.08 * Math.sin((tp / 4) * Math.PI * 2));
        glow.style.transform = `translate(${hub.x.toFixed(1)}px, ${hub.y.toFixed(1)}px)`;
        glow.style.opacity = hub.visible ? gk.toFixed(3) : 0;
        const wv = prog(t, W_BHARAT, 1.6);
        if (wv > 0 && wv < 1) { wave.setAttribute("cx", hub.x.toFixed(1)); wave.setAttribute("cy", hub.y.toFixed(1)); wave.setAttribute("r", (30 + 330 * out3(wv)).toFixed(1)); wave.setAttribute("opacity", (0.8 * (1 - wv)).toFixed(3)); }
        else wave.setAttribute("opacity", 0);
        cards.update(t, earth);
        kick.update(t);
        // legend emphasis on "tel / seema / vyapaar ke raaste": active row full, others dim (colour only, nothing moves)
        for (let i = 0; i < 3; i++) {
          let a = 1;
          if (t >= W_R_TEL - 0.1) { const act = t < W_R_SEEMA - 0.1 ? 0 : t < W_R_VYA - 0.1 ? 1 : 2; a = act === i ? 1 : 0.42; }
          $("s12-r" + i).style.opacity = a.toFixed(2);
        }
      });

      // ---------- text: kicker typed, legend rows rise as each family first appears, headline on "chhe" ----------
      tl.fromTo("#s12-scrim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.4);
      tl.fromTo("#s12-credit", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
      tl.fromTo("#s12-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, W_POORI - 0.3);
      [W_TEL + 0.15, W_SEEMA + 0.15, W_TARIFF + 0.15].forEach((at, i) => {
        tl.fromTo(`#s12-r${i}`, { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo(`#s12-sw${i}`, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, at + 0.1);
      });
      // two-line headline rises as one unit
      tl.fromTo("#s12-h1", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, W_CHHE - 0.05);
      tl.fromTo("#s12-h2", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, W_CHHE + 0.05);
      // clear all text before the join (last 0.8 s empty); arcs, pins and the glow stay for s13
      const OUT = 26.5;
      tl.to(["#s12-h1", "#s12-h2"], { yPercent: -105, duration: 0.4, ease: "power2.in" }, OUT);
      tl.to(["#s12-r0", "#s12-r1", "#s12-r2"], { yPercent: -105, duration: 0.4, ease: "power2.in", stagger: 0.04 }, OUT + 0.02);
      tl.to("#s12-rule", { scaleX: 0, duration: 0.3, ease: "power2.in" }, OUT + 0.05);
      tl.to("#s12-scrim", { opacity: 0, duration: 0.5, ease: "power1.in" }, OUT);
      tl.to("#s12-credit", { opacity: 0, duration: 0.4 }, OUT);

      window.__timelines["main"] = tl;
      done();
    </script>
  </body>
</html>
