<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.min.js", "three/addons/": "./assets/vendor/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #04070f; }
      #earth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #s12-fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      #s12-glow { position: absolute; left: 0; top: 0; width: 440px; height: 440px; margin: -220px 0 0 -220px; border-radius: 50%;
                  background: radial-gradient(closest-side, rgba(45,212,191,.42), rgba(45,212,191,.16) 45%, rgba(45,212,191,0) 100%);
                  mix-blend-mode: screen; opacity: 0; }
      .s12-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,9,27,.82) 0%, rgba(4,9,27,.82) 26%, rgba(4,9,27,0) 55%); opacity: 0; }
      .s12-block { position: absolute; left: 96px; top: 138px; width: 1000px; }
      .s12-kicker { display: flex; align-items: center; gap: 16px; font: 700 28px Inter; letter-spacing: 5px; color: #fbbf24; text-transform: uppercase;
                    text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .s12-kicker i { display: block; width: 44px; height: 6px; background: #fbbf24; transform-origin: left center; }
      .s12-mask { overflow: hidden; }
      .s12-h { font: 400 168px/1.0 Anton; color: #f8fafc; text-transform: uppercase; white-space: nowrap;
               text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .s12-h.s12-k { color: #ff6b6b; }
      .s12-h1wrap { margin-top: 10px; }
      .s12-legend { position: absolute; left: 96px; top: 575px; }
      .s12-row { display: flex; align-items: center; gap: 20px; height: 50px; font: 700 28px Inter; letter-spacing: 5px; text-transform: uppercase; white-space: nowrap;
                 text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .s12-row i { display: block; width: 44px; height: 7px; border-radius: 4px; transform-origin: left center; }
      .s12-row.s12-oil { color: #fbbf24; } .s12-row.s12-oil i { background: #fbbf24; }
      .s12-row.s12-bor { color: #ff6b6b; } .s12-row.s12-bor i { background: #ff6b6b; }
      .s12-row.s12-trd { color: #2dd4bf; } .s12-row.s12-trd i { background: #2dd4bf; }
      .s12-lab { position: absolute; left: 0; top: 0; font: 700 26px Inter; letter-spacing: 5px; color: #f8fafc; white-space: nowrap; opacity: 0;
                 text-shadow: 0 3px 2.5px rgba(2,6,16,.75), 0 6px 12px rgba(2,6,16,.5); }
      .s12-credit { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font: 600 20px Inter; color: #cbd5e1; letter-spacing: 1px;
                    text-shadow: 0 2px 3px rgba(2,6,16,.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.4" data-width="1920" data-height="1080">
      <canvas id="earth"></canvas>
      <div id="s12-glow"></div>
      <svg id="s12-fx" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g id="s12-lines"></g>
        <g id="s12-leaders"></g>
        <g id="s12-pulses"></g>
      </svg>
      <div id="s12-labs"></div>
      <div class="s12-scrim" id="s12-scrim"></div>
      <div class="s12-block">
        <div class="s12-kicker"><i id="s12-rule"></i><span id="s12-kick">Poori tasveer</span></div>
        <div class="s12-mask s12-h1wrap"><div class="s12-h" id="s12-h1">6 Aag</div></div>
        <div class="s12-mask"><div class="s12-h s12-k" id="s12-h2">Ek Bharat.</div></div>
      </div>
      <div class="s12-legend">
        <div class="s12-mask"><div class="s12-row s12-oil" id="s12-r0"><i id="s12-sw0"></i><span>Tel ke raaste</span></div></div>
        <div class="s12-mask"><div class="s12-row s12-bor" id="s12-r1"><i id="s12-sw1"></i><span>Seema ke raaste</span></div></div>
        <div class="s12-mask"><div class="s12-row s12-trd" id="s12-r2"><i id="s12-sw2"></i><span>Vyapaar ke raaste</span></div></div>
      </div>
      <div class="s12-credit">NASA Blue Marble · Borders: DataMeet, Natural Earth (India view)</div>
    </div>
    <script type="module">
      import { createEarth, camAt, driveWithTimeline } from "./assets/geo/engine.js";
      /*CUES*/ const CUES = {"c01": 0.6, "c02": 4.04, "c03": 8.45, "c04": 10.91, "c05": 15.82, "c06": 18.76, "c07": 21.71, "c08": 23.18, "c09": 27.11}; /*END CUES*/
      const DUR = /*DUR*/ 33.4 /*END DUR*/;

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      let done;
      window.__hf.buildReady["earth"] = new Promise((r) => (done = r));

      // One continuous camera: START 24,95,9000 -> pull out west over India -> END 27,70,16000.
      const CAM = [
        { t: 0, lat: 24, lon: 95, alt: 9000, tilt: 0, heading: 0 },
        { t: CUES.c02 + 2.6, lat: 27, lon: 75, alt: 13000, tilt: 0, heading: 0, ease: "inOut" },
        { t: CUES.c07 + 0.6, lat: 28, lon: 65.5, alt: 14200, tilt: 0, heading: 0, ease: "inOut" },
        { t: DUR, lat: 27, lon: 70, alt: 16000, tilt: 0, heading: 0, ease: "inOut" },
      ];

      const earth = await createEarth({ canvas: document.getElementById("earth"), assetBase: "./assets/geo/", regions: [] });

      // ---------- pure helpers (all motion below is a function of t: seek-safe) ----------
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (t, a, d) => clamp01((t - a) / d);
      const eOut = (x) => 1 - Math.pow(1 - x, 3);
      const eInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const bell = (t, a, d) => { const x = (t - a) / d; return x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x); };
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

      const AMBER = "#fbbf24", CORAL = "#ff6b6b", TEAL = "#2dd4bf";
      const HUB = { lat: 22.6, lon: 79.4 }; // central India: every line lands here

      // six fires; grp 0 = oil (amber), 1 = border (coral), 2 = trade/chips (teal)
      const FIRES = [
        { id: "hormuz",    lat: 26.6,  lon: 56.3,  grp: 0, col: AMBER, draw: CUES.c02 + 0.5,  bow: 0.20, lab: "Hormuz",    off: [-56, -54], right: true },
        { id: "ferozepur", lat: 30.92, lon: 74.61, grp: 1, col: CORAL, draw: CUES.c03 + 0.4,  bow: 0.14, lab: "Ferozepur", off: [-58, 34], right: true },
        { id: "lac",       lat: 34.76, lon: 78.22, grp: 1, col: CORAL, draw: CUES.c04 + 0.9,  bow: 0.10, lab: "LAC",       off: [58, 12], right: false },
        { id: "shaksgam",  lat: 36.12, lon: 76.55, grp: 1, col: CORAL, draw: CUES.c04 + 2.4,  bow: 0.12, lab: "Shaksgam",  off: [-58, -50], right: true },
        { id: "ukraine",   lat: 49.0,  lon: 31.5,  grp: 0, col: AMBER, draw: CUES.c05 + 0.4,  bow: 0.16, lab: "Ukraine",   off: [58, 34], right: false },
        { id: "taiwan",    lat: 23.7,  lon: 121.0, grp: 2, col: TEAL,  draw: CUES.c06 + 0.4,  bow: 0.20, lab: "Taiwan",    off: [-58, -56], right: true },
      ];
      // pulses pop on "poori tasveer" (Taiwan carries over from s11, already lit)
      const POP = { taiwan: -1, hormuz: CUES.c01 + 0.25, ferozepur: CUES.c01 + 0.5, lac: CUES.c01 + 0.75, shaksgam: CUES.c01 + 0.95, ukraine: CUES.c01 + 1.2 };
      // labels: in on the fire's cue, out before the headline (c07)
      const LAB_IN = { hormuz: CUES.c02 + 0.2, ferozepur: CUES.c03 + 0.2, lac: CUES.c04 + 0.6, shaksgam: CUES.c04 + 2.1, ukraine: CUES.c05 + 0.2, taiwan: CUES.c06 + 0.2 };
      const LAB_OUT = { hormuz: CUES.c03 - 0.2, ferozepur: CUES.c04 + 3.6, lac: CUES.c05 - 0.2, shaksgam: CUES.c05 - 0.2, ukraine: CUES.c06 - 0.1, taiwan: CUES.c07 - 0.5 };
      const DRAW_D = 1.6;                          // line draw-on seconds
      const FLOW = CUES.c08 + 0.2;                 // "lapatein" start travelling into India
      const EMPH = [CUES.c09 + 0.1, CUES.c09 + 1.45, CUES.c09 + 2.8]; // tel / seema / vyapaar
      const LINES_OUT = DUR - 1.7;                 // lines clear before the join; pulses stay for s13

      const gLines = document.getElementById("s12-lines"), gLead = document.getElementById("s12-leaders"), gPul = document.getElementById("s12-pulses");
      const labLayer = document.getElementById("s12-labs");
      for (const f of FIRES) {
        f.under = mk("path", { fill: "none", stroke: f.col, "stroke-width": 11, "stroke-linecap": "round", "stroke-opacity": 0.18, pathLength: 1, "stroke-dasharray": "1 1" }, gLines);
        f.path = mk("path", { fill: "none", stroke: f.col, "stroke-width": 4, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": "1 1" }, gLines);
        f.sparks = [0, 1].map(() => {
          const g = mk("g", {}, gLines);
          mk("circle", { r: 7, fill: f.col, "fill-opacity": 0.35 }, g);
          mk("circle", { r: 3.2, fill: "#f8fafc" }, g);
          return g;
        });
        f.lead = mk("line", { stroke: "#ffffff", "stroke-opacity": 0.8, "stroke-width": 2 }, gLead);
        f.leadDot = mk("circle", { r: 5, fill: "#f8fafc" }, gLead);
        const pg = mk("g", {}, gPul);
        f.pg = pg;
        f.rings = [0, 1, 2].map(() => mk("circle", { r: 14, fill: "none", stroke: CORAL, "stroke-width": 3 }, pg));
        mk("circle", { r: 11, fill: CORAL }, pg);
        mk("circle", { r: 4.5, fill: "#f8fafc" }, pg);
        const lab = document.createElement("div");
        lab.className = "s12-lab"; lab.textContent = f.lab; labLayer.appendChild(lab); f.labEl = lab;
      }
      const glow = document.getElementById("s12-glow");

      // screen-space arc (quadratic bezier) from a fire into the hub, bowed upward
      function arc(p0, p1, bow) {
        const dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len, ny = dx / len;
        if (ny > 0) { nx = -nx; ny = -ny; }
        return { x0: p0.x, y0: p0.y, cx: (p0.x + p1.x) / 2 + nx * len * bow, cy: (p0.y + p1.y) / 2 + ny * len * bow, x1: p1.x, y1: p1.y };
      }
      const bez = (a, u) => ({ x: (1 - u) * (1 - u) * a.x0 + 2 * (1 - u) * u * a.cx + u * u * a.x1, y: (1 - u) * (1 - u) * a.y0 + 2 * (1 - u) * u * a.cy + u * u * a.y1 });

      const tl = gsap.timeline({ paused: true });
      driveWithTimeline(tl, DUR, (t) => {
        earth.render(camAt(CAM, t));
        const hub = earth.project(HUB.lat, HUB.lon, 0);
        const linesK = 1 - eInOut(ramp(t, LINES_OUT, 1.3));
        for (const f of FIRES) {
          const p = earth.project(f.lat, f.lon, 0);
          // pulse: pop (back.out) then breathe, rings expand on a 1.6 s period
          const pop = POP[f.id] < 0 ? 1 : backOut(ramp(t, POP[f.id], 0.55));
          const ph = (t % 1.6) / 1.6;
          const breathe = 1 + 0.06 * Math.sin(ph * Math.PI * 2);
          f.pg.setAttribute("transform", `translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) scale(${(pop * breathe).toFixed(4)})`);
          f.pg.setAttribute("opacity", p.visible && pop > 0.001 ? clamp01(pop) : 0);
          f.rings.forEach((c, k) => {
            const q = (ph + k / 3) % 1;
            c.setAttribute("r", (13 + q * 34).toFixed(2));
            c.setAttribute("stroke-opacity", ((1 - q) * [0.59, 0.35, 0.2][k] * 1.3).toFixed(3));
          });
          // line draw-on + group emphasis on "tel / seema / vyapaar ke raaste"
          const a = arc(p, hub, f.bow);
          const d = `M${a.x0.toFixed(1)},${a.y0.toFixed(1)} Q${a.cx.toFixed(1)},${a.cy.toFixed(1)} ${a.x1.toFixed(1)},${a.y1.toFixed(1)}`;
          const prog = eInOut(ramp(t, f.draw, DRAW_D));
          const em = bell(t, EMPH[f.grp], 1.5);
          const vis = p.visible ? linesK : 0;
          const lvis = prog > 0.0005 ? vis : 0;
          for (const el of [f.path, f.under]) { el.setAttribute("d", d); el.setAttribute("stroke-dashoffset", (1 - prog).toFixed(4)); el.setAttribute("opacity", lvis); }
          f.path.setAttribute("stroke-width", (4 + 3.5 * em).toFixed(2));
          f.under.setAttribute("stroke-width", (11 + 8 * em).toFixed(2));
          f.under.setAttribute("stroke-opacity", (0.18 + 0.2 * em).toFixed(3));
          // sparks travel each line into India from "lapatein" on
          const fl = ramp(t, FLOW, 0.8) * vis;
          f.sparks.forEach((s, k) => {
            const u = (((t - FLOW) / 2.4 + k / 2) % 1 + 1) % 1;
            const pt = bez(a, u);
            s.setAttribute("transform", `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
            s.setAttribute("opacity", (fl * Math.sin(Math.PI * u)).toFixed(3));
          });
          // label + leader line
          const lo = eOut(ramp(t, LAB_IN[f.id], 0.45)) * (1 - ramp(t, LAB_OUT[f.id], 0.4));
          const lv = p.visible ? lo : 0;
          const ex = p.x + f.off[0], ey = p.y + f.off[1];
          const lk = eOut(ramp(t, LAB_IN[f.id], 0.35));
          f.lead.setAttribute("x1", p.x.toFixed(1)); f.lead.setAttribute("y1", p.y.toFixed(1));
          f.lead.setAttribute("x2", (p.x + f.off[0] * lk).toFixed(1)); f.lead.setAttribute("y2", (p.y + f.off[1] * lk).toFixed(1));
          f.lead.setAttribute("opacity", lv.toFixed(3));
          f.leadDot.setAttribute("cx", ex.toFixed(1)); f.leadDot.setAttribute("cy", ey.toFixed(1));
          f.leadDot.setAttribute("opacity", lv.toFixed(3));
          f.labEl.style.transform = f.right
            ? `translate(${(ex - 12).toFixed(1)}px, ${ey.toFixed(1)}px) translate(-100%, -50%)`
            : `translate(${(ex + 12).toFixed(1)}px, ${ey.toFixed(1)}px) translate(0, -50%)`;
          f.labEl.style.opacity = lv.toFixed(3);
        }
        // India hub glow: lights when every fire's line reaches it, then breathes; stays into s13
        const gk = 0.6 * eOut(ramp(t, CUES.c08 + 0.1, 1.6)) * (1 + 0.08 * Math.sin((t / 4) * Math.PI * 2));
        glow.style.transform = `translate(${hub.x.toFixed(1)}px, ${hub.y.toFixed(1)}px)`;
        glow.style.opacity = hub.visible ? gk.toFixed(3) : 0;
      });

      // ---------- text (style A): kicker on c01, legend rows as each colour first appears, headline on c07 ----------
      tl.fromTo("#s12-scrim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, CUES.c01 - 0.2);
      tl.fromTo("#s12-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, CUES.c01);
      tl.fromTo("#s12-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, CUES.c01 + 0.15);
      const ROW_IN = [CUES.c02 + 0.3, CUES.c03 + 0.3, CUES.c06 + 0.3];
      ROW_IN.forEach((at, i) => {
        tl.fromTo(`#s12-r${i}`, { yPercent: 100 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo(`#s12-sw${i}`, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, at + 0.1);
      });
      // legend rows nudge right while their lines swell (tel / seema / vyapaar)
      EMPH.forEach((at, i) => {
        tl.fromTo(`#s12-sw${i}`, { scaleX: 1 }, { scaleX: 1.7, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(`#s12-sw${i}`, { scaleX: 1.7 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false }, at + 0.8);
      });
      tl.fromTo("#s12-h1", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, CUES.c07 - 0.1);
      tl.fromTo("#s12-h2", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, CUES.c07 + 0.2);
      // headline breathes very slightly during the hold (seek-safe single tween)
      tl.fromTo(".s12-block", { scale: 1 }, { scale: 1.025, duration: DUR - 1.6 - CUES.c07, ease: "none", transformOrigin: "0% 50%" }, CUES.c07);

      // ---------- clear text before the join (last 0.8 s empty) ----------
      const OUT = DUR - 1.45;
      tl.to(["#s12-h1", "#s12-h2"], { yPercent: -100, duration: 0.4, ease: "power2.in", stagger: 0.06 }, OUT);
      tl.to(["#s12-r0", "#s12-r1", "#s12-r2"], { yPercent: -100, duration: 0.4, ease: "power2.in", stagger: 0.05 }, OUT + 0.05);
      tl.to("#s12-kick", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, OUT);
      tl.to("#s12-rule", { scaleX: 0, duration: 0.3, ease: "power2.in" }, OUT + 0.1);
      tl.to("#s12-scrim", { opacity: 0, duration: 0.5, ease: "power1.in" }, OUT + 0.15);

      window.__timelines["main"] = tl;
      done();
    </script>
  </body>
</html>
