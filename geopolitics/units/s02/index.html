<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.min.js", "three/addons/": "./assets/vendor/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #04070f; }
      #earth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #s02-fx { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,9,27,.82) 0%, rgba(4,9,27,.82) 26%, rgba(4,9,27,0) 55%); }
      .scrim-r { position: absolute; inset: 0; background: linear-gradient(270deg, rgba(4,9,27,.7) 0%, rgba(4,9,27,.6) 14%, rgba(4,9,27,0) 30%); }
      .block { position: absolute; left: 96px; top: 150px; width: 900px; }
      .kicker { display: flex; align-items: center; gap: 16px; font: 700 28px Inter; letter-spacing: 5px; color: #fbbf24; text-transform: uppercase;
                text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .kicker i { display: block; width: 44px; height: 6px; background: #fbbf24; transform-origin: left center; }
      .mask { overflow: hidden; }
      .gap { height: 22px; }
      .h { font: 400 170px/1.04 Anton; color: #f8fafc; text-transform: uppercase; white-space: nowrap;
           text-shadow: 0 3px 2.5px rgba(2,6,16,.7), 0 8px 26px rgba(2,6,16,.4); }
      .h.k { color: #ff6b6b; }
      .row { position: absolute; left: 1466px; top: 0; white-space: nowrap; opacity: 0; }
      .row .lab { font: 700 26px/1 Inter; letter-spacing: 5px; color: #f8fafc; text-transform: uppercase;
                  text-shadow: 0 3px 2.5px rgba(2,6,16,.75), 0 6px 12px rgba(2,6,16,.5); }
      .row .lab b { font-weight: 700; display: inline-block; width: 40px; }
      .meter { display: flex; gap: 4px; margin-top: 14px; }
      .meter span { display: block; width: 14px; height: 7px; border-radius: 1px; background: rgba(148,163,184,.35); position: relative; overflow: hidden; }
      .meter span em { position: absolute; inset: 0; background: #ff6b6b; opacity: 0; }
      .credit { position: absolute; left: 0; right: 0; top: 1028px; text-align: center; font: 600 20px Inter; color: #cbd5e1; letter-spacing: 1px;
                text-shadow: 0 2px 2px rgba(2,6,16,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.4" data-width="1920" data-height="1080">
      <canvas id="earth"></canvas>
      <div class="scrim" id="s02-scrim"></div>
      <div class="scrim-r" id="s02-scrim-r"></div>
      <svg id="s02-fx" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g id="s02-leaders"></g>
        <g id="s02-pulses"></g>
      </svg>
      <div id="s02-rows"></div>
      <div class="block" id="s02-block">
        <div class="kicker"><i id="s02-rule"></i><span id="s02-kick">Bharat ke nazariye se</span></div>
        <div class="gap"></div>
        <div class="mask"><div class="h" id="s02-h1">Khatre ki</div></div>
        <div class="mask"><div class="h k" id="s02-h2">Ranking.</div></div>
      </div>
      <div class="credit">NASA Blue Marble &nbsp;·&nbsp; Borders: DataMeet, Natural Earth (India view)</div>
    </div>
    <script type="module">
      import { createEarth, camAt, driveWithTimeline } from "./assets/geo/engine.js";
      /*CUES*/ const CUES = {"c01": 0.6, "c02": 2.07, "c03": 8.95, "c04": 15.33, "c05": 17.78, "c06": 21.71, "c07": 25.15, "c08": 27.11, "c09": 30.55}; /*END CUES*/
      const DUR = /*DUR*/ 36.4 /*END DUR*/;
      const C = CUES;

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      let done;
      window.__hf.buildReady["earth"] = new Promise((r) => (done = r));

      // ---------- camera: START (30,62,24000) -> pull back to the hemisphere -> lean toward each station as it is named
      //            -> recentre -> dive to END over the Gulf (27,58,14000)
      const CAM = [
        { t: 0, lat: 30, lon: 62, alt: 24000, tilt: 0, heading: 0 },
        { t: C.c02 + 1.0, lat: 29, lon: 63, alt: 30000, tilt: 0, heading: 0 },               // whole picture
        { t: C.c03 - 0.3, lat: 28, lon: 61, alt: 29500, tilt: 0, heading: 0, ease: "linear" }, // station 1: Hormuz
        { t: C.c03 + 2.2, lat: 30, lon: 67, alt: 29000, tilt: 0, heading: 0 },               // station 2: Pakistan
        { t: C.c05 + 1.2, lat: 33, lon: 72, alt: 29000, tilt: 0, heading: 0 },               // stations 3 + 4: China
        { t: C.c07 - 0.6, lat: 37, lon: 62, alt: 30500, tilt: 0, heading: 0 },               // station 5: Ukraine
        { t: C.c09, lat: 30, lon: 72, alt: 30000, tilt: 0, heading: 0 },                     // station 6: Taiwan
        { t: C.c09 + 2.4, lat: 30, lon: 66, alt: 31000, tilt: 0, heading: 0 },               // recentre on India
        { t: DUR, lat: 27, lon: 58, alt: 14000, tilt: 0, heading: 0 },                        // dive to the Gulf: hand-off
      ];

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (t, a, d) => clamp01((t - a) / d);
      const smooth = (x) => x * x * (3 - 2 * x);
      const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

      function makePulse(layer, maxR = 42) {
        const g = el("g", { opacity: 0 }, layer);
        const rings = [150, 90, 50].map((a) => ({ a: a / 255, c: el("circle", { r: 11, fill: "none", stroke: "#ff6b6b", "stroke-width": 2.5 }, g) }));
        const dot = el("circle", { r: 11, fill: "#ff6b6b" }, g);
        el("circle", { r: 4.5, fill: "#f8fafc" }, g);
        return { g, rings, dot, maxR };
      }
      function drawPulse(P, p, t, alpha, boost = 0) {
        const a = alpha * (p.visible ? 1 : 0);
        if (a <= 0.002) { P.g.setAttribute("opacity", 0); return; }
        const s = 1 + 0.3 * boost;
        P.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${s.toFixed(3)})`);
        P.g.setAttribute("opacity", a.toFixed(3));
        P.dot.setAttribute("r", (11 * (1 + 0.07 * Math.sin(t * Math.PI * 2 / 1.6))).toFixed(2));
        for (let i = 0; i < 3; i++) {
          const ph = (((t / 1.6 + i / 3) % 1) + 1) % 1;
          P.rings[i].c.setAttribute("r", (11 + (P.maxR - 11) * ph).toFixed(1));
          P.rings[i].c.setAttribute("stroke-opacity", (Math.min(1, P.rings[i].a * 1.6) * (1 - ph) * (0.6 + 0.4 * boost)).toFixed(3));
        }
      }

      // ---------- stations (rank order = India's point of view), meter = 5 bars, value from the approved board
      const ROWY = [250, 362, 475, 587, 699, 811];
      const ST = [
        { n: 1, name: "Hormuz", ll: [26.6, 56.3], m: 5, on: C.c02 + 0.4 },
        { n: 2, name: "Pakistan seema", ll: [30.92, 74.61], m: 5, on: C.c03 + 0.4 },
        { n: 3, name: "LAC", ll: [34.76, 78.22], m: 4, on: C.c04 + 0.5 },
        { n: 4, name: "Shaksgam", ll: [36.12, 76.55], m: 4, on: C.c05 + 1.9 },
        { n: 5, name: "Ukraine", ll: [49.0, 31.5], m: 3, on: C.c06 + 0.4 },
        { n: 6, name: "Taiwan", ll: [23.7, 121.0], m: 2, on: C.c07 + 0.4 },
      ];
      const OUT = C.c09 + 2.4;        // legend + headline clear before the dive
      const rowsEl = document.getElementById("s02-rows");
      const lead = document.getElementById("s02-leaders");
      const pulses = document.getElementById("s02-pulses");
      ST.forEach((s, i) => {
        s.y = ROWY[i];
        s.next = i < ST.length - 1 ? ST[i + 1].on : C.c08;  // the row stays "active" until the next one is named
        const r = document.createElement("div");
        r.className = "row"; r.style.top = (s.y - 13) + "px";
        r.innerHTML = `<div class="lab"><b>${s.n}</b>${s.name}</div><div class="meter">${"<span><em></em></span>".repeat(5)}</div>`;
        rowsEl.appendChild(r);
        s.row = r; s.bars = [...r.querySelectorAll("em")];
        s.line = el("line", { stroke: "#f8fafc", "stroke-width": 2, "stroke-opacity": 0.8, "stroke-linecap": "round" }, lead);
        s.pin = el("circle", { r: 5, fill: "#f8fafc", opacity: 0 }, lead);
        s.end = el("circle", { r: 5, fill: "#f8fafc", opacity: 0 }, lead);
        s.pulse = makePulse(pulses, 40);
      });

      const earth = await createEarth({ canvas: document.getElementById("earth"), assetBase: "./assets/geo/", regions: [] });
      const tl = gsap.timeline({ paused: true });

      driveWithTimeline(tl, DUR, (t) => {
        earth.render(camAt(CAM, t));
        // India glows a little brighter on "hamare ghar ke kitne kareeb"
        earth.setLineOpacity("india_glow", 1.9 + 0.8 * Math.min(smooth(ramp(t, C.c09 + 0.2, 0.8)), 1 - smooth(ramp(t, OUT, 1.0))));
        const out = 1 - smooth(ramp(t, OUT, 0.45));
        for (const s of ST) {
          const p = earth.project(s.ll[0], s.ll[1], 0);
          const active = t >= s.on && t < s.next + 0.2 ? Math.min(smooth(ramp(t, s.on, 0.35)), 1 - smooth(ramp(t, s.next, 0.4))) : 0;
          const allOn = smooth(ramp(t, C.c08, 0.5));
          // pulses: all six carry over from the hook; during the dive only Hormuz stays
          const keep = s.n === 1 ? 1 : 1 - smooth(ramp(t, OUT + 0.2, 1.8));
          drawPulse(s.pulse, p, t, keep, active);
          // leader line: dot pops at the pin, line draws to the row, label fades in
          const kd = smooth(ramp(t, s.on, 0.55)) * out;
          const ex = 1450, ey = s.y;
          if (kd > 0.002 && p.visible) {
            const x2 = p.x + (ex - p.x) * kd, y2 = p.y + (ey - p.y) * kd;
            s.line.setAttribute("x1", p.x.toFixed(1)); s.line.setAttribute("y1", p.y.toFixed(1));
            s.line.setAttribute("x2", x2.toFixed(1)); s.line.setAttribute("y2", y2.toFixed(1));
            s.line.setAttribute("stroke-opacity", (0.8 * out * (0.55 + 0.45 * Math.max(active, allOn))).toFixed(3));
            s.pin.setAttribute("cx", p.x.toFixed(1)); s.pin.setAttribute("cy", p.y.toFixed(1));
            s.pin.setAttribute("opacity", out.toFixed(3));
          } else { s.line.setAttribute("stroke-opacity", 0); s.pin.setAttribute("opacity", 0); }
          const pe = ramp(t, s.on + 0.45, 0.35);
          const pk = pe >= 1 ? 1 : Math.max(0, backOut(pe));
          s.end.setAttribute("cx", ex); s.end.setAttribute("cy", ey);
          s.end.setAttribute("r", (5 * pk).toFixed(2)); s.end.setAttribute("opacity", (out * (pe > 0 ? 1 : 0)).toFixed(3));
          const la = smooth(ramp(t, s.on + 0.55, 0.4));
          s.row.style.opacity = (la * out * (0.72 + 0.28 * Math.max(active, allOn))).toFixed(3);
          s.row.style.transform = `translateX(${((1 - la) * 18).toFixed(1)}px)`;
          s.bars.forEach((b, i) => { b.style.opacity = i < s.m ? smooth(ramp(t, s.on + 0.8 + i * 0.12, 0.18)).toFixed(3) : "0"; });
        }
      });

      // ---------- headline block (style A)
      tl.fromTo(["#s02-scrim", "#s02-scrim-r"], { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, C.c01);
      tl.fromTo("#s02-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, C.c01 + 0.2);
      tl.fromTo("#s02-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.c01 + 0.35);
      tl.fromTo("#s02-h1", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, C.c01 + 0.5);
      tl.fromTo("#s02-h2", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, C.c01 + 0.62);
      // "Bharat ke nazariye se": the kicker flashes as the voice says it
      tl.fromTo("#s02-kick", { color: "#fbbf24" }, { color: "#fde68a", duration: 0.3, ease: "power1.out", immediateRender: false }, C.c08 + 0.2);
      tl.to("#s02-kick", { color: "#fbbf24", duration: 0.6, ease: "power1.in" }, C.c08 + 0.9);
      tl.fromTo("#s02-block", { scale: 1 }, { scale: 1.02, duration: OUT - C.c01, ease: "none", transformOrigin: "0% 50%" }, C.c01);
      // clear before the dive
      tl.to(["#s02-h1", "#s02-h2"], { yPercent: -100, duration: 0.4, ease: "power2.in", stagger: 0.08 }, OUT);
      tl.to(["#s02-kick", "#s02-rule"], { opacity: 0, duration: 0.35, ease: "power2.in" }, OUT + 0.1);
      tl.to(["#s02-scrim", "#s02-scrim-r"], { opacity: 0, duration: 0.8, ease: "power1.inOut" }, OUT + 0.3);

      window.__timelines["main"] = tl;
      done();
    </script>
  </body>
</html>
